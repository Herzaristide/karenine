name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anna:
    name: Build anna (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cpal's ALSA backend needs the ALSA dev headers + pkg-config to build.
      - name: Install audio build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: anna

      - name: Format
        working-directory: anna
        run: cargo fmt --check

      - name: Lint
        working-directory: anna
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build + test
        working-directory: anna
        run: cargo build --locked && cargo test --locked

  flake:
    name: Build flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Valide que le layout ~/.config/quickshell s'assemble correctement.
      - name: nix flake check
        run: nix flake check --print-build-logs
