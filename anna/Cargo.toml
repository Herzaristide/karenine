[package]
name = "anna"
version = "0.1.0"
edition = "2021"
description = "anna — unified engine daemon for the karenine Quickshell interface (accent/palette theming + hardware stats)"

[[bin]]
name = "anna"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native audio I/O (mic capture for tuner/chroma, click playback for metronome).
cpal = "0.15"
# FFT for the pitch detector and chromagram.
rustfft = "6"
# Gesture control (webcam → hand landmarks → workspace swipes + finger cursor).
# ONNX Runtime is loaded at runtime from nixpkgs (ORT_DYLIB_PATH, set by the
# wrapper): `download-binaries` would fetch a prebuilt lib during the build,
# which the Nix sandbox forbids anyway.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }
# uinput virtual pointer (absolute axes + left button).
evdev = "0.13"
# The Nextcloud account (cloud/): its notes API, CalDAV and the login flow,
# over HTTPS. rustls with bundled roots: no OpenSSL to link, no system store
# to find.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
base64 = "0.22"
